
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários | Biblioteca Web</title>
    <link rel="stylesheet" href="cadastro-usuario.css">
</head>
<body>
    <header class="cabecalho">
        <h1>BIBLIOTECA WEB</h1>
        <span id="nomeUsuario"></span>
    </header>

    <div class="layout">
        <nav class="menu-lateral">
            <a href="../dashboard/dashboard.html">Dashboard</a>
            <a href="cadastro-usuario.html">Cadastro de Usuários</a>
            <a href="../cadastro-livro/cadastro-livro.html">Cadastro de Livros</a>
            <a href="../listagem-livro/listagem-livro.html">Listar Livros</a>
            <button type="button" disabled>Realizar Empréstimo</button>
            <button type="button" disabled>Realizar Devolução</button>
            <button type="button" id="btnSair">Sair</button>
        </nav>

        <main class="conteudo">
            <h2>Cadastro de Usuários</h2>

            <form id="formUsuario">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" minlength="4" maxlength="80" required>

                <label for="genero">Gênero</label>
                <select id="genero" name="genero" required>
                    <option value="">Selecione</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Outro">Outro</option>
                    <option value="Prefiro não informar">Prefiro não informar</option>
                </select>

                <label for="dataNascimento">Data de nascimento</label>
                <input type="text" id="dataNascimento" name="dataNascimento"
                       placeholder="DD/MM/AAAA" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" inputmode="numeric" required>

                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" name="telefone" inputmode="numeric" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <h3>Endereço</h3>

                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" inputmode="numeric" required>

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" required>

                <label for="estado">Estado</label>
                <input type="text" id="estado" name="estado" required>

                <label for="logradouro">Logradouro</label>
                <input type="text" id="logradouro" name="logradouro" required>

                <label for="numero">Número</label>
                <input type="number" id="numero" name="numero" required>

                <label for="complemento">Complemento</label>
                <input type="text" id="complemento" name="complemento">

                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" required>

                <button type="submit">Salvar</button>
                <p id="mensagem" role="status"></p>
            </form>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
    <script type="module" src="cadastro-usuario.js"></script>
</body>
</html>
