
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros | Biblioteca Web</title>
    <link rel="stylesheet" href="cadastro-livro.css">
</head>
<body>
    <header class="cabecalho">
        <h1>BIBLIOTECA WEB</h1>
        <span id="nomeUsuario"></span>
    </header>

    <div class="layout">
        <nav class="menu-lateral">
            <a href="../dashboard/dashboard.html">Dashboard</a>
            <a href="../cadastro-usuario/cadastro-usuario.html">Cadastro de Usuários</a>
            <a href="cadastro-livro.html">Cadastro de Livros</a>
            <a href="../listagem-livro/listagem-livro.html">Listar Livros</a>
            <button type="button" disabled>Realizar Empréstimo</button>
            <button type="button" disabled>Realizar Devolução</button>
            <button type="button" id="btnSair">Sair</button>
        </nav>

        <main class="conteudo">
            <h2>Cadastro de Livros</h2>

            <form id="formLivro">
                <label for="titulo">Título</label>
                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    minlength="4"
                    maxlength="80"
                    required
                >

                <label for="autor">Autor</label>
                <input
                    type="text"
                    id="autor"
                    name="autor"
                    minlength="4"
                    maxlength="80"
                    required
                >

                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="Programação">Programação</option>
                    <option value="Web Design">Web Design</option>
                    <option value="Banco de Dados">Banco de Dados</option>
                    <option value="Ferramentas">Ferramentas</option>
                    <option value="Design">Design</option>
                </select>

                <label for="paginas">Número de páginas</label>
                <input
                    type="number"
                    id="paginas"
                    name="paginas"
                    min="1"
                    required
                >

                <button type="submit">Salvar</button>
                <p id="mensagem" role="status"></p>
            </form>
        </main>
    </div>

    <script type="module" src="cadastro-livro.js"></script>
</body>
</html>
